<style>
/* Layout: one-column phone app, soft dusty-peach summary card on warm dark ground, fixed bottom tabs + floating add button */
:root{
  --bg:#1b1715; --surface:#252019; --surface2:#2e2823; --line:#3a332d;
  --fg:#e8e0d8; --muted:#9a8f86; --peach:#d9b6a1; --ink:#2f1d14; --ink-soft:#6b4a3a; --short:#7f3523;

  --display:"Urbanist",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5f0eb; --surface:#fcfaf7; --surface2:#ede5dd; --line:#e2d8ce;
  --fg:#3a2d26; --muted:#85776d; --peach:#e3c4b1; --ink:#2f1d14; --ink-soft:#6b4a3a; --short:#8a3a26;
  --accent:#a8613f; --good:#4f7f5c; --bad:#a9503e; --warn:#8f6a1f;
  --c1:#c0866b; --c2:#b8995a; --c3:#6f9878; --c4:#6c8eab; --c5:#8a7cab; --c6:#ab7486; --c7:#93887f; --c8:#5f958c; --c9:#878c52;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f5f0eb; --surface:#fcfaf7; --surface2:#ede5dd; --line:#e2d8ce;
  --fg:#3a2d26; --muted:#85776d; --peach:#e3c4b1; --ink:#2f1d14; --ink-soft:#6b4a3a; --short:#8a3a26;
  --accent:#a8613f; --good:#4f7f5c; --bad:#a9503e; --warn:#8f6a1f;
  --c1:#c0866b; --c2:#b8995a; --c3:#6f9878; --c4:#6c8eab; --c5:#8a7cab; --c6:#ab7486; --c7:#93887f; --c8:#5f958c; --c9:#878c52;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.coin{width:38px;height:38px;border-radius:12px;background:var(--peach);display:grid;place-items:center;color:var(--ink)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:28px 28px 0 0;max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

.amtfield{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amtfield:focus-within{border-color:var(--accent)}
.amtfield span{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}

.field label{font-size:13px;color:var(--muted);font-weight:600}

.box .field textarea{background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--peach);color:var(--ink);font-family:var(--display);font-weight:800;font-size:17px;border-radius:18px;padding:16px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:.2s;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px)}

.prog{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:7px}

.tog{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border-radius:14px;font-weight:500;cursor:pointer}

.box{background:var(--surface2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.box h4{margin:0;font-family:var(--display);font-size:16px;font-weight:700}
.box .acts{display:flex;gap:6px;flex-wrap:wrap}
.box .acts button{padding:8px 0;margin-right:14px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.title{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.sdot{width:12px;height:12px;border-radius:4px;flex:none}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .per{font-size:14px;font-weight:600;color:var(--ink-soft)}
.card.short .big{color:var(--short)}
.qbtn{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--ink) 10%,transparent);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--ink);flex:none}
.eq{display:flex;flex-direction:column;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:18px;padding:4px 14px}
.eq .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:14.5px;font-weight:600;color:var(--ink-soft);width:100%;text-align:left}
.eq .r b{font-family:var(--display);font-size:17px;color:var(--ink);font-weight:800}
.eq .r+.r{border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.eq .fix{font-size:12.5px;font-weight:700;margin-left:6px;color:var(--ink)}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.notice h4{margin:0;font-family:var(--display);font-size:17px;font-weight:700}
.notice .acts,.box .acts{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.notice .acts .plain,.box .acts .plain,.box .acts .ghost{padding:8px 0}
.primary.sm{padding:11px 18px;font-size:15px;border-radius:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;font-weight:600;cursor:pointer}
.sw+.sw{border-top:1px solid var(--line)}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw input:checked{background:var(--good)}

.pick{display:flex;gap:12px;align-items:center;padding:11px 0;cursor:pointer}
.pick+.pick{border-top:1px solid var(--line)}
.pick input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.pick .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .t{font-weight:600}
.pick .s{font-size:13px;color:var(--muted)}
.pick .amt{font-family:var(--display);font-weight:700;white-space:nowrap}

.empty:not(:has(strong)){padding:18px 20px}

.ask-q{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3;text-wrap:balance}
.ask-q b{font-weight:800}
.ask-l,.ql{font-size:13px;font-weight:700;color:var(--muted)}
.ask .acts{display:flex;gap:18px;flex-wrap:wrap}.ask .acts .plain{padding:6px 0}.plain.dim{color:var(--muted)}

<div class="app" id="app"><p class="loading">Opening your hisaab…</p></div>

<button class="fab" id="fab" aria-label="Add money entry">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add
</button>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast" role="status"><span id="toastmsg"></span><button id="toastundo" hidden>Undo</button></div>

<script>
const OUT=[["Food","--c1"],["Petrol","--c4"],["Bills","--c2"],["Shopping","--c5"],["Family","--c3"],["Health","--c8"],["Transport","--c9"],["Other","--c7"]];
const IN=[["Salary","--c3"],["Gift","--c5"],["Other","--c7"]];
/* special kinds: not spending or income, they move loans and borrowed money */
const SPECIAL_OUT=[["Loan repay","Paid back a loan","--c6"],["Sent back","Sent back money that wasn't mine","--c4"],["Lent","Lent to someone","--c5"]];
const SPECIAL_IN=[["Borrowed","Loan I took","--c6"],["To send back","Not mine, I'll send it back","--c4"],["Paid back to me","Someone paid me back","--c5"]];
const SPECIAL=SPECIAL_OUT.concat(SPECIAL_IN).map(x=>x[0]);
const HIDDEN={"Savings":"--c9","From savings":"--c9","Top-up":"--c4","Balance fix":"--c7"};
const NOT_SPEND=new Set(["Savings","Loan repay","Sent back","Lent","Balance fix"]);
const NOT_INCOME=new Set(["Borrowed","To send back","Paid back to me","From savings","Balance fix"]);
const isSpend=t=>t.type==="out"&&!NOT_SPEND.has(t.cat);
const isIncome=t=>t.type==="in"&&!NOT_INCOME.has(t.cat);
function tagColor(c){const f=OUT.concat(IN).find(x=>x[0]===c);if(f)return f[1];const sp=SPECIAL_OUT.concat(SPECIAL_IN).find(x=>x[0]===c);if(sp)return sp[2];if(HIDDEN[c])return HIDDEN[c];
  let h=0;for(const ch of String(c||""))h=(h*31+ch.charCodeAt(0))>>>0;return "--c"+(1+h%9)}
const catColor=(type,c)=>"var("+tagColor(c)+")";
const COLS=["txns","bills","buy","savings","loans"];
const blank=()=>({txns:[],bills:[],buy:[],savings:[],loans:[]});
const NATIVE=window.HisaabNative||null;

const S={cols:blank(),prof:{cur:"Rs",catMap:{}},mode:"local",root:null,tab:"home",loading:!!(window.claude&&window.claude.use)};
const LS="hisaab.v1";
try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d){S.cols=Object.assign(blank(),d.cols);S.prof=Object.assign({cur:"Rs",catMap:{}},d.prof)}}catch(e){}
try{const t=localStorage.getItem("hisaab.tab");if(t)S.tab=t}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({cols:S.cols,prof:S.prof}))}catch(e){}}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const SAVE_ERR="Couldn't save that. Check your internet and try again.";

async function add(col,data){const id=newId();data.created=Date.now();
  if(S.mode==="db"){await S.root.collection(col).doc(id).set(data)}else{S.cols[col].push(Object.assign({id},data));saveLocal();render()}return id}
async function upd(col,id,patch){

async function recordTxn(data){

const GUESS=[[/TEA|CAFE|COFFEE|FOOD|KFC|MCDONALD|PIZZA|BURGER|BIRYANI|RESTAURANT|BAKERY|BAKERS|SWEETS|DHABA|HOTEL|MART|GROCER|STORE|SUPER ?MARKET|CHAYE|CHAI/,"Food"],

  [/CAREEM|UBER|INDRIVE|BYKEA|YANGO|METRO BUS|PARKING/,"Transport"],

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function msgDate(b,ms){let m;
  if(m=b.match(/\b(20\d\d)-(\d\d)-(\d\d)\b/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=b.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](20\d\d)\b/))return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  if(m=b.match(/\b(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ](20\d\d)\b/)){const mo=MON[m[2].toLowerCase()];if(mo)return m[3]+"-"+pad(mo)+"-"+pad(m[1])}
  return ms?dstr(new Date(+ms)):today()}
function parseSms(body,ms){
  const b=String(body||"");
  if(/fail|unsuccess|declin|revers|\botp\b|one.time|verification|\bpin\b|tokeni/i.test(b))return null;
  const am=b.match(/(?:rs\.?|pkr)\s*([\d,]+(?:\.\d{1,2})?)/i);if(!am)return null;
  const amount=parseFloat(am[1].replace(/,/g,""));if(!(amount>0))return null;
  const OUTRE=/\b(paid|sent|charged|debited|withdrawn|withdrawal|transferred|purchase|deducted|spent)\b/i,INRE=/\b(received|credited|deposited|cash ?in|refunded|refund)\b/i;
  const o=b.search(OUTRE),i=b.search(INRE);if(o<0&&i<0)return null;
  const type=o<0?"in":i<0?"out":(o<i?"out":"in");
  const rest=b.slice(am.index);
  const STOP="(?=\\s{2,}|\\s+on\\s|\\s+via\\s|\\s+for\\s|\\s+from\\s|,|\\.\\s|\\.$|\\(|\\s+A\\/C|\\s+AC#|\\s+account|$)";
  const r=rest.match(new RegExp(type==="out"?"\\b(?:at|to)\\s+(.+?)"+STOP:"\\bfrom\\s+(.+?)"+STOP,"i"));
  let who=r?r[1].trim().replace(/\s+PK$/i,"").replace(/\s+(LHR|LAHORE|KHI|KARACHI|ISB|ISLAMABAD|RWP|RAWALPINDI|FSD|FAISALABAD|MULTAN|PESHAWAR|PSH)(\s+CITY)?$/i,"").trim():"";if(/^\d/.test(who))who="";who=who.slice(0,40);
  const key=who.toUpperCase();
  const idm=b.match(/(?:txn\s*id|trx\s*id|transaction\s*id|\btid)\s*[:#.]?\s*([A-Z0-9]{5,})/i);
  const date=msgDate(b,ms);const ref="sms:"+(idm?idm[1]:date+":"+amount+":"+b.length);
  let cat="";
  if(type==="out"&&key){if(S.prof.catMap&&S.prof.catMap[key])cat=S.prof.catMap[key];else{const g=GUESS.find(([re])=>re.test(key));if(g)cat=g[1]}}
  const name=who?titleCase(who):"";
  return{type,amount,cat,merchant:key,who:name,note:name||(type==="in"?"Money in":"Bank payment"),ref,date}}
function splitMsgs(text){return String(text||"").split(/\n\s*\n|(?=\bTxn ID\b)/i).map(x=>x.trim()).filter(Boolean)}
/* returns {r:"dup"|"matched"|"added", id} */
async function saveImported(p){
  const dup=S.cols.txns.find(t=>t.ref===p.ref);if(dup)return{r:"dup",id:dup.id};
  const src=SMS.bank||"meezan";
  const man=S.cols.txns.find(t=>!t.ref&&t.type===p.type&&same(t.amount,p.amount)&&dayDiff(t.date,p.date)<=2);
  if(man){await upd("txns",man.id,{ref:p.ref,src,merchant:p.merchant,who:p.who||"",linked:true});return{r:"matched",id:man.id}}
  const reviewed=p.reviewed===true;
  const id=await add("txns",{type:p.type,cat:p.cat||"Other",amount:p.amount,note:p.note,date:p.date,ref:p.ref,src,merchant:p.merchant,who:p.who||"",linked:false,reviewed,flag:p.flag||""});
  return{r:"added",id}}
async function importText(text){
  if(isBackup(text)){restoreSheet(String(text).trim());return}
  const parsed=splitMsgs(text).map(m=>parseSms(m)).filter(Boolean);
  if(!parsed.length){toast("Couldn't find a payment in that message.");return}
  if(parsed.length===1){const p=parsed[0];if(S.cols.txns.some(t=>t.ref===p.ref)){toast("That payment is already added");return}txSheet(null,p);return}
  let added=0,dup=0;
  try{for(const p of parsed){const x=await saveImported(p);if(x.r==="added")added++;else dup++}}catch(e){toast(SAVE_ERR);return}
  toast("Added "+added+" payment"+(added===1?"":"s")+(added?" to tag on Home":"")+(dup?" · "+dup+" already there":""))}

const mIdx=mk=>{const[y,m]=String(mk).split("-").map(Number);return y*12+m-1};
const mKey=i=>Math.floor(i/12)+"-"+pad(i%12+1);
const mDate=i=>new Date(Math.floor(i/12),i%12,1);
const FIX="Balance fix";
function normProf(){const p=S.prof;let ch=false;p.cur=p.cur||"Rs";p.catMap=p.catMap||{};
  p.tabs=Object.assign({bills:true,savings:true,loans:true,buy:true,history:true},p.tabs||{});
  if(!p.salary||!p.salary.start){p.salary={every:2,start:MK()};ch=true}return ch}
const tabOn=t=>t==="home"||(S.prof.tabs||{})[t]!==false;
function PER(){const L=Math.max(1,+S.prof.salary.every||1),s=mIdx(S.prof.salary.start),c=mIdx(MK());const st=s+Math.floor((c-s)/L)*L;return{key:mKey(st),start:st,end:st+L-1,L}}
const mShort=i=>mDate(i).toLocaleDateString("en-GB",{month:"short"});
function perLabel(p){return p.L===1?mDate(p.start).toLocaleDateString("en-GB",{month:"long"}):mShort(p.start)+" – "+mShort(p.end)}
const inPer=(ds,p)=>{const i=mIdx(String(ds||"").slice(0,7));return i>=p.start&&i<=p.end};

/* bills: payments are stored per salary period; older bills stored one paid month */
function paysOf(b,p){if(Array.isArray(b.payments))return b.payments.slice();
  return b.paid&&inPer(b.paid,p)?[{p:p.key,a:+b.amount||0,t:b.paidTxn||"",prev:b.paidPrev||null,d:b.paid+"-01"}]:[]}
const billPaid=(b,p)=>paysOf(b,p).filter(x=>b.once||x.p===p.key).reduce((a,x)=>a+(+x.a||0),0);
const billLeft=(b,p)=>Math.max(0,(+b.amount||0)-billPaid(b,p));
const loanLeft=l=>Math.max(0,(+l.amount||0)-(+l.paidBack||0));
const sumBy=(arr,f)=>arr.reduce((a,x)=>a+(+f(x)||0),0);

function plan(){
  const p=PER(),tx=S.cols.txns;
  const inHand=sumBy(tx,t=>(t.type==="in"?1:-1)*(+t.amount||0));
  const ptx=tx.filter(t=>t.cat!==FIX&&inPer(t.date,p));
  const rec=tabOn("bills")?S.cols.bills.filter(b=>!b.once):[];
  const once=tabOn("bills")?S.cols.bills.filter(b=>b.once&&billLeft(b,p)>0):[];
  const lns=tabOn("loans")?S.cols.loans.filter(l=>l.inPlan!==false&&loanLeft(l)>0):[];
  const buys=tabOn("buy")?S.cols.buy.filter(i=>!i.done):[];
  const hold=Math.max(0,sumBy(tx.filter(t=>t.type==="in"&&t.cat==="To send back"),t=>t.amount)-sumBy(tx.filter(t=>t.type==="out"&&t.cat==="Sent back"),t=>t.amount));
  const rows=[
    {k:"bills",label:"Bills",c:"--c2",left:sumBy(rec,b=>billLeft(b,p)),total:sumBy(rec,b=>b.amount),n:rec.length},
    {k:"once",tab:"bills",label:"One-time payments",c:"--c1",left:sumBy(once,b=>billLeft(b,p)),total:sumBy(once,b=>b.amount),n:once.length,names:once.map(b=>b.name)},
    {k:"loans",label:"Loans to pay back",c:"--c6",left:sumBy(lns,loanLeft),total:sumBy(lns,l=>l.amount),n:lns.length},
    {k:"buy",label:"To buy",c:"--c5",left:sumBy(buys,i=>i.amount),total:sumBy(buys,i=>i.amount),n:buys.length,names:buys.map(i=>i.name)},
    {k:"hold",tab:"home",label:"Money to send back",c:"--c4",left:hold,total:hold,n:hold>0.005?1:0}
  ].filter(r=>r.n>0);
  const toPay=sumBy(rows,r=>r.left);
  const end=new Date(Math.floor(p.end/12),p.end%12+1,0);
  const daysLeft=Math.max(1,Math.round((end-pdate(today()))/864e5)+1);
  return{p,inHand,toPay,safe:inHand-toPay,rows,ptx,daysLeft,
    inP:sumBy(ptx.filter(isIncome),t=>t.amount),outP:sumBy(ptx.filter(isSpend),t=>t.amount),
    waste:sumBy(ptx.filter(t=>isSpend(t)&&t.flag==="waste"),t=>t.amount)}}
function rowSub(r){
  if(r.k==="bills")return r.left<=0?"All paid":r.left<r.total?money(r.total-r.left)+" paid of "+money(r.total):r.n+" bill"+(r.n>1?"s":"")+" · nothing paid yet";
  if(r.k==="loans")return r.n+" loan"+(r.n>1?"s":"")+(r.left<r.total?" · "+money(r.total-r.left)+" paid back":"");
  if(r.k==="hold")return"Sent to you by mistake or for someone else";
  return r.names.join(", ")}
function catBar(txs){
  const by={};txs.filter(t=>t.type==="out").forEach(t=>{by[t.cat]=(by[t.cat]||0)+(+t.amount||0)});
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);const tot=sumBy(cats,c=>c[1]);if(!tot)return"";
  return `<div class="bar">${cats.map(([c,v])=>`<span style="width:${(v/tot*100).toFixed(2)}%;background:${catColor("out",c)}"></span>`).join("")}</div>
  <div class="legend">${cats.map(([c,v])=>`<div><i style="background:${catColor("out",c)}"></i><span class="n">${esc(c)}</span><span class="a num">${esc(nf.format(v))}</span></div>`).join("")}</div>`}

function header(){

  <button class="iconbtn" data-act="settings" aria-label="Settings">${ICON.gear}</button></header>`}
const kindLabel=c=>{const sp=SPECIAL_OUT.concat(SPECIAL_IN).find(x=>x[0]===c);return sp?sp[1]:c};
function txRow(t){const todo=t.reviewed===false;const c=todo?"var(--line)":catColor(t.type,t.cat);
  const bank=t.src==="easypaisa"?"Easypaisa":t.src==="meezan"?"Meezan":"";
  const sub=t.cat===FIX?"Balance fix":todo?"Needs a tag":[kindLabel(t.cat),t.who&&t.who!==t.note?t.who:"",t.flag==="important"?"★ Important":t.flag==="waste"?"Not needed":"",bank].filter(Boolean).join(" · ");
  return `<button class="row" data-act="edit-tx" data-id="${t.id}"><div class="dot" style="background:${c}">${todo?"?":esc((t.cat||"?")[0])}</div>
  <div class="mid"><div class="t">${esc(t.note||t.cat)}</div><div class="s ${todo?"soon":""}">${esc(sub)}</div></div>
  <div class="amt num ${t.type==="in"?"in":""}">${t.type==="in"?"+":"−"}${esc(S.prof.cur)} ${nf.format(+t.amount||0)}</div></button>`}

function pendingList(){return S.cols.txns.filter(t=>t.reviewed===false).sort((a,b)=>(SKIP.has(a.id)-SKIP.has(b.id))||(a.date||"").localeCompare(b.date||"")||(a.created||0)-(b.created||0))}
const SKIP=new Set();
function askCard(){
  const list=pendingList();if(!list.length)return"";const x=list[0],out=x.type==="out";
  const guess=x.cat&&x.cat!=="Other"&&!SPECIAL.includes(x.cat)?[x.cat]:[];
  const quick=out?[...new Set(guess.concat(["Food","Petrol","Bills","Shopping","Family"],(S.prof.tags||[]).slice(-3)))].slice(0,7):["Salary","Gift","Other"];
  const specs=out?[["Loan repay","Paid back a loan"],["Sent back","Sent back money"]]:[["Borrowed","Loan I took"],["To send back","Not mine"]];
  return `<section class="ask" aria-label="Tag a payment">
    <div class="ask-top"><span>${esc(x.src==="easypaisa"?"Easypaisa":"Meezan")} · ${esc(dayLabel(x.date))}</span><span>${list.length>1?"1 of "+list.length:"Last one"}</span></div>
    <div class="ask-q">${out?"You spent":"You got"} <b class="num">${esc(money(x.amount))}</b>${x.who?` ${out?"at":"from"} <b>${esc(x.who)}</b>`:""}</div>
    <div class="ask-l">${out?"What was it for?":"What is this money?"}</div>
    <div class="chips">${quick.map(c=>`<button class="chip" data-act="qtag" data-id="${x.id}" data-cat="${esc(c)}"><i style="background:${catColor(x.type,c)}"></i>${esc(c)}</button>`).join("")}
      ${specs.map(([c,l])=>`<button class="chip spec" data-act="qspec" data-id="${x.id}" data-cat="${c}">${esc(l)}</button>`).join("")}</div>
    <div class="acts"><button class="plain" data-act="review" data-id="${x.id}">Add a note or more options</button><button class="plain dim" data-act="later" data-id="${x.id}">Later</button></div>
  </section>`}
function home(){
  const P=plan(),p=P.p,lab=perLabel(p);let h="";
  if(canSms()&&SMS.bank==="easypaisa")h+=`<div class="notice"><h4>Switch to Meezan Bank</h4>
    <div class="note">Hisaab will read your Meezan Bank messages instead of Easypaisa. Each payment then shows up here and asks what it was for.</div>
    <div class="acts"><button class="primary sm" data-act="meezan">Set up Meezan</button></div></div>`;
  if(S.update)h+=`<div class="notice"><h4>Update ready: Hisaab ${esc(S.update)}</h4>
    <div class="note">Your entries stay as they are.</div>

  h+=askCard();
  if(seedPending())h+=`<div class="notice"><h4>Add the plan you sent?</h4>
    <div class="note">${SEED.bills.length} bills, ${SEED.once.length} one-time payments, ${SEED.loans.length} loans and ${SEED.buy.length} things to buy. You'll see each one before anything is added.</div>
    <div class="acts"><button class="primary sm" data-act="seed">Review and add</button><button class="plain" data-act="seed-skip">Don't add</button></div></div>`;
  if(!guideDone())h+=`<div class="notice"><h4>Home now plans your whole salary</h4>
    <div class="note">The big number is what you can safely spend until your next salary, after everything you still have to pay.</div>
    <div class="note"><b>Do this first:</b> tap <b>In hand</b> on the card and enter what's in your Meezan account right now.</div>
    <div class="acts"><button class="plain" data-act="explain">How it works</button><button class="plain" data-act="guide-ok">Got it</button></div></div>`;
  const short=P.safe<0;
  h+=`<section class="card ${short?"short":""}" aria-label="Safe to spend">
    <div class="top"><div><div class="lbl">Safe to spend</div><div class="per">${esc(lab)} salary</div></div><button class="qbtn" data-act="explain" aria-label="How this works">?</button></div>
    <div class="big num">${esc(money(P.safe))}</div>
    <div class="per">${short?`Your plan needs ${esc(money(-P.safe))} more than you have.`:P.safe>0?`About ${esc(money(Math.floor(P.safe/P.daysLeft)))} a day for the next ${P.daysLeft} days.`:"Everything you have is already planned."}</div>
    <div class="eq">
      <button class="r" data-act="fix"><span>In hand <u class="fix">fix</u></span><b class="num">${esc(money(P.inHand))}</b></button>
      <div class="r"><span>− Still to pay</span><b class="num">${esc(money(P.toPay))}</b></div>
      <div class="r"><span>= Safe to spend</span><b class="num">${esc(money(P.safe))}</b></div>
    </div></section>`;
  if(P.rows.length){
    const tot=sumBy(P.rows,r=>r.left)+Math.max(0,P.safe);
    h+=`<section class="sec"><div class="sechead"><h2>Still to pay</h2><span class="aside">${esc(lab)}</span></div>
    ${tot>0?`<div class="bar">${P.rows.filter(r=>r.left>0).map(r=>`<span style="width:${(r.left/tot*100).toFixed(2)}%;background:var(${r.c})"></span>`).join("")}${P.safe>0?`<span style="width:${(P.safe/tot*100).toFixed(2)}%;background:var(--good)"></span>`:""}</div>`:""}
    <div class="list">${P.rows.map(r=>`<button class="row" data-tab="${r.tab||r.k}"><i class="sdot" style="background:var(${r.c})"></i><div class="mid"><div class="t">${esc(r.label)}</div><div class="s">${esc(rowSub(r))}</div></div><div class="amt num">${esc(money(r.left))}</div></button>`).join("")}
    ${P.safe>0?`<div class="row"><i class="sdot" style="background:var(--good)"></i><div class="mid"><div class="t">Safe to spend</div><div class="s">Free after everything above</div></div><div class="amt num">${esc(money(P.safe))}</div></div>`:""}</div></section>`}
  else h+=`<div class="empty"><strong>Nothing planned yet</strong><span>Add your bills and loans, and Home shows where your salary goes.</span></div>`;
  if(tabOn("bills")){const d=new Date().getDate();
    const soon=S.cols.bills.filter(b=>+b.day&&billLeft(b,p)>0&&(+b.day)-d<=5).sort((a,b)=>a.day-b.day).slice(0,3);
    if(soon.length)h+=`<section class="sec"><div class="sechead"><h2>Pay soon</h2><button class="link" data-tab="bills">All bills</button></div><div class="list">${soon.map(b=>billRow(b,p)).join("")}</div></section>`}
  h+=`<section class="sec"><div class="sechead"><h2>This salary so far</h2><span class="aside">${esc(lab)}</span></div>
    <div class="summary"><div class="tile"><div class="k">Income</div><div class="v num" style="color:var(--good)">${esc(money(P.inP))}</div></div>
    <div class="tile"><div class="k">Spent</div><div class="v num">${esc(money(P.outP))}</div></div></div>${catBar(P.ptx.filter(isSpend))}
    ${P.waste>0?`<p class="note">You marked ${esc(money(P.waste))} of this as not needed.</p>`:""}</section>`;
  const all=S.cols.txns.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0)).slice(0,40);
  if(!all.length)h+=`<div class="empty"><strong>Nothing added yet</strong><span>Tap <b>Add</b> each time you spend or get money.${NATIVE?" Or turn on Meezan Bank SMS in Settings.":""}</span></div>`;
  else{const groups={};all.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
    h+=`<section class="sec"><div class="sechead"><h2>Recent</h2></div>`+Object.keys(groups).map(k=>{const s=sumBy(groups[k].filter(isSpend),t=>t.amount);
      return `<div class="sechead daylbl"><span>${esc(dayLabel(k))}</span><span class="num">${s?"Spent "+esc(nf.format(s)):""}</span></div><div class="list">${groups[k].map(txRow).join("")}</div>`}).join("")+`</section>`}
  return h}

function billRow(b,p){const left=billLeft(b,p),paid=billPaid(b,p),amt=+b.amount||0;let sub,cls="";
  if(left<=0)sub=b.once?"Paid off":"Paid for "+perLabel(p);
  else{const parts=[];if(paid>0)parts.push(nf.format(paid)+" of "+nf.format(amt)+" paid");
    const day=+b.day;if(day){const d=new Date().getDate();
      if(day<d){cls="over";parts.push("was due the "+ord(day))}else if(day===d){cls="over";parts.push("due today")}
      else if(day-d<=5){cls="soon";parts.push("due in "+(day-d)+" day"+(day-d>1?"s":""))}else parts.push("due the "+ord(day))}
    if(!parts.length)parts.push(b.once?"One-time":"Every salary");
    sub=parts.join(" · ");sub=sub[0].toUpperCase()+sub.slice(1)}
  return `<div class="row"><button class="mid" style="text-align:left" data-act="edit-bill" data-id="${b.id}"><div class="t">${esc(b.name)}</div><div class="s ${cls}" style="white-space:normal">${esc(sub)}</div></button>
  <div class="amt num">${esc(money(left>0?left:amt))}</div>
  ${left>0?`<button class="paybtn" data-act="pay" data-id="${b.id}">Pay</button>`:`<span class="paid">${ICON.check}</span>`}</div>`}
function bills(){
  const p=PER(),lab=perLabel(p);
  const rec=S.cols.bills.filter(b=>!b.once).sort((a,b)=>((billLeft(a,p)<=0)-(billLeft(b,p)<=0))||((+a.day||40)-(+b.day||40)));
  const once=S.cols.bills.filter(b=>b.once);const openO=once.filter(b=>billLeft(b,p)>0),doneO=once.filter(b=>billLeft(b,p)<=0);
  const left=sumBy(rec.concat(openO),b=>billLeft(b,p));
  const paidP=sumBy(S.cols.bills,b=>sumBy(paysOf(b,p).filter(x=>x.p===p.key),x=>x.a));
  let h=`<h2 class="title">Bills</h2>
  <div class="summary"><div class="tile"><div class="k">Still to pay</div><div class="v num">${esc(money(left))}</div></div>
  <div class="tile"><div class="k">Paid this salary</div><div class="v num" style="color:var(--good)">${esc(money(paidP))}</div></div></div>
  <section class="sec"><div class="sechead"><h2>Every salary</h2><span class="aside">${esc(lab)}</span></div>
  ${rec.length?`<div class="list">${rec.map(b=>billRow(b,p)).join("")}</div>`:`<div class="empty"><span>Rent, fees, gym: anything you pay from every salary.</span></div>`}</section>`;
  if(openO.length)h+=`<section class="sec"><div class="sechead"><h2>One-time</h2></div><div class="list">${openO.map(b=>billRow(b,p)).join("")}</div></section>`;
  h+=`<button class="addrow" data-act="new-bill">${ICON.plus} Add a bill</button>`;
  if(doneO.length)h+=`<section class="sec"><div class="sechead"><h2>Paid off</h2></div><div class="list">${doneO.map(b=>billRow(b,p)).join("")}</div></section>`;
  h+=`<p class="note">Every-salary bills come back when your next salary starts. One-time payments move to Paid off once they're paid. You can pay any bill in parts.</p>`;
  return h}

function savRow(p){const pct=p.target?Math.min(100,(+p.saved||0)/p.target*100):0;
  return `<div class="row"><button class="mid" style="text-align:left" data-act="edit-sav" data-id="${p.id}"><div class="t">${esc(p.name)}</div>
  <div class="s">${esc(money(p.saved||0))}${p.target?" of "+esc(money(p.target)):" saved"}</div>${p.target?`<div class="prog"><span style="width:${pct.toFixed(1)}%"></span></div>`:""}</button>
  <button class="paybtn" data-act="move-sav" data-id="${p.id}">Put in</button></div>`}
function savings(){
  const P=plan();const list=S.cols.savings.slice().sort((a,b)=>(a.created||0)-(b.created||0));
  const total=sumBy(S.cols.savings,x=>x.saved);const putIn=sumBy(P.ptx.filter(t=>t.type==="out"&&t.cat==="Savings"),t=>t.amount);
  let h=`<h2 class="title">Savings</h2>
  <div class="summary"><div class="tile"><div class="k">Total saved</div><div class="v num" style="color:var(--good)">${esc(money(total))}</div></div>
  <div class="tile"><div class="k">Put in this salary</div><div class="v num">${esc(money(putIn))}</div></div></div>`;
  h+=list.length?`<div class="list">${list.map(savRow).join("")}</div>`:`<div class="empty"><strong>No savings yet</strong><span>Make a pot for each thing you save for, like an emergency fund or Eid.</span></div>`;
  h+=`<button class="addrow" data-act="new-sav">${ICON.plus} New savings pot</button>
  <p class="note">Money you put in leaves In hand, so you don't spend it by mistake.</p>`;

function loanRow(l){const amt=+l.amount||0,back=+l.paidBack||0,left=loanLeft(l);const pct=amt?Math.min(100,back/amt*100):0;
  let cls="",when="";
  if(left>0&&l.due){const dd=Math.round((pdate(l.due)-pdate(today()))/864e5);if(dd<0){cls="over";when=" · overdue since "+fmtDate(l.due)}else{cls=dd<=5?"soon":"";when=" · by "+fmtDate(l.due)}}
  const sub=left>0?money(left)+" left of "+money(amt)+when+(l.inPlan===false?" · not this salary":""):"Cleared · "+money(amt);
  return `<div class="row"><button class="mid" style="text-align:left" data-act="edit-loan" data-id="${l.id}"><div class="t">${esc(l.name)}</div>
  <div class="s ${cls}">${esc(sub)}</div><div class="prog"><span style="width:${pct.toFixed(1)}%"></span></div></button>
  ${left>0?`<button class="paybtn" data-act="repay" data-id="${l.id}">Pay back</button>`:`<span class="paid">${ICON.check}</span>`}</div>`}
function loans(){
  const open=S.cols.loans.filter(l=>loanLeft(l)>0).sort((a,b)=>(b.inPlan!==false)-(a.inPlan!==false)||(a.due||"9999").localeCompare(b.due||"9999"));
  const done=S.cols.loans.filter(l=>loanLeft(l)<=0);
  const owed=sumBy(open,loanLeft),thisSal=sumBy(open.filter(l=>l.inPlan!==false),loanLeft);
  let h=`<h2 class="title">Loans</h2>
  <div class="summary"><div class="tile"><div class="k">You owe in total</div><div class="v num" style="color:${owed>0?"var(--bad)":"var(--good)"}">${esc(money(owed))}</div></div>
  <div class="tile"><div class="k">Paying from this salary</div><div class="v num">${esc(money(thisSal))}</div></div></div>`;
  h+=open.length?`<div class="list">${open.map(loanRow).join("")}</div>`:`<div class="empty"><strong>${done.length?"All loans cleared":"No loans"}</strong><span>Add money you've borrowed so you can see what's left to pay back.</span></div>`;
  h+=`<button class="addrow" data-act="new-loan">${ICON.plus} Add a loan</button>`;
  if(done.length)h+=`<section class="sec"><div class="sechead"><h2>Cleared</h2></div><div class="list">${done.map(loanRow).join("")}</div></section>`;
  h+=`<p class="note">Loans marked "not this salary" stay here but aren't counted in Safe to spend. Tap a loan to change that.</p>`;
  return h}

function buy(){
  const P=plan();const items=S.cols.buy;const open=items.filter(i=>!i.done).sort((a,b)=>(a.created||0)-(b.created||0));const done=items.filter(i=>i.done);
  const need=sumBy(open,i=>i.amount);
  let h=`<h2 class="title">To buy</h2>
  <div class="summary"><div class="tile"><div class="k">This list will cost</div><div class="v num">${esc(money(need))}</div></div>
  <div class="tile"><div class="k">Safe to spend after it</div><div class="v num" style="color:${P.safe<0?"var(--bad)":"var(--good)"}">${esc(money(P.safe))}</div></div></div>`;
  h+=open.length?`<div class="list">${open.map(buyRow).join("")}</div>`:`<div class="empty"><strong>Your list is empty</strong><span>Write things down before you buy them. It stops impulse spending.</span></div>`;

  if(done.length)h+=`<section class="sec"><div class="sechead"><h2>Bought</h2><button class="link" data-act="clear-bought">Clear</button></div><div class="list">${done.map(buyRow).join("")}</div></section>`;
  return h}
function buyRow(i){return `<div class="row ${i.done?"done":""}"><button class="check ${i.done?"on":""}" data-act="${i.done?"edit-buy":"bought"}" data-id="${i.id}" aria-label="${i.done?"Bought":"Mark as bought"}">${i.done?ICON.check:""}</button>
  <button class="mid" style="text-align:left" data-act="edit-buy" data-id="${i.id}"><div class="t">${esc(i.name)}</div>${i.note?`<div class="s">${esc(i.note)}</div>`:""}</button>
  <div class="amt num">${i.amount?esc(money(i.amount)):'<span class="note">No price</span>'}</div></div>`}

function history(){
  const months={};const get=mk=>months[mk]||(months[mk]={in:0,spent:0,saved:0,taken:0,back:0,waste:0,tx:[]});
  S.cols.txns.forEach(t=>{if(t.cat===FIX||!t.date)return;const m=get(t.date.slice(0,7)),a=+t.amount||0;
    if(t.type==="in"){if(t.cat==="From savings")m.saved-=a;else if(isIncome(t))m.in+=a}
    else if(t.cat==="Savings")m.saved+=a;else if(t.cat==="Loan repay")m.back+=a;else if(isSpend(t)){m.spent+=a;m.tx.push(t);if(t.flag==="waste")m.waste+=a}});
  S.cols.loans.forEach(l=>{if(l.date)get(l.date.slice(0,7)).taken+=+l.amount||0});
  const keys=Object.keys(months).sort().reverse();
  let h=`<h2 class="title">History</h2>`;
  if(!keys.length)return h+`<div class="empty"><strong>No history yet</strong><span>Each month shows up here as you add money in and out.</span></div>`;
  h+=keys.map(k=>{const m=months[k];
    const stat=(l,v,c)=>`<div><div class="k">${l}</div><div class="v num"${c&&v?` style="color:${c}"`:""}>${esc(money(v))}</div></div>`;
    return `<section class="hcard"><h3>${esc(mDate(mIdx(k)).toLocaleDateString("en-GB",{month:"long",year:"numeric"}))}${k===MK()?"<span>so far</span>":""}</h3>
    <div class="hgrid">${stat("Money in",m.in,"var(--good)")}${stat("Spent",m.spent)}${stat("Saved",m.saved,"var(--good)")}${stat("Loans taken",m.taken,"var(--bad)")}${stat("Paid back",m.back)}${m.waste?stat("Not needed",m.waste,"var(--warn)"):""}</div>
    ${catBar(m.tx)}</section>`}).join("");
  h+=`<p class="note">Spent leaves out savings, loan payments and money you sent back, which have their own numbers. Loans taken uses the date on each loan.</p>`;
  return h}

const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),sin=document.getElementById("sheetin");
function openSheet(html,setup){sin.innerHTML='<div class="handle"></div>'+html;sin.onkeydown=null;sheet.hidden=false;scrim.hidden=false;
  requestAnimationFrame(()=>{sheet.classList.add("show");scrim.classList.add("show")});setup&&setup();
  const f=sin.querySelector("[autofocus]");if(f)setTimeout(()=>f.focus(),60)}
function closeSheet(){sheet.classList.remove("show");scrim.classList.remove("show");setTimeout(()=>{if(!sheet.classList.contains("show")){sheet.hidden=true;scrim.hidden=true;sin.innerHTML=""}},230)}
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});

const amtField=(id,val,auto,label)=>`<div class="amtfield"><span>${esc(S.prof.cur)}</span><input id="${id}" inputmode="decimal" placeholder="0" autocomplete="off" value="${val??""}" ${auto?"autofocus":""} aria-label="${label||"Amount"}"></div>`;

function txSheet(t,draft,opts){

  if(t&&t.cat===FIX){openSheet(`<h3>Balance fix</h3><p class="note" style="font-size:15px;color:var(--fg)">${t.type==="in"?"Added":"Removed"} ${esc(money(t.amount))} on ${esc(fmtDate(t.date))} so In hand matched your real balance. It isn't counted as spending or income.</p>
    <button class="ghost" id="fx-del">Delete this fix</button>`,()=>{$("fx-del").onclick=async()=>{closeSheet();try{await del("txns",t.id)}catch(e){toast(SAVE_ERR)}}});return}
  const d0=t||draft;const fromBank=!!(d0&&d0.ref);const origCat=d0?d0.cat:"",merchant=d0&&d0.merchant;const review=!!(t&&t.reviewed===false)||!!draft||!!opts.review;
  const linkedLoan=t?S.cols.loans.find(l=>l.inTxn===t.id||(l.payments||[]).some(x=>x.t===t.id)):null;
  const st={type:d0?d0.type:"out",cat:d0?(d0.cat||""):"",flag:(t&&t.flag)||""};
  if(review&&(st.cat==="Other"||st.cat==="Top-up")&&!opts.cat)st.cat="";
  if(opts.cat)st.cat=opts.cat;
  const tagList=()=>st.type==="in"?IN.map(x=>x[0]):[...new Set(OUT.map(x=>x[0]).concat(S.prof.tags||[]))];
  const chip=c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===st.cat}"><i style="background:${catColor(st.type,c)}"></i>${esc(c)}</button>`;
  const chips=()=>{const l=tagList();if(st.cat&&!SPECIAL.includes(st.cat)&&!l.includes(st.cat))l.push(st.cat);
    return l.map(chip).join("")+(st.type==="out"?`<button class="chip add" id="f-addtag">+ New tag</button>`:"")};
  const specs=()=>(st.type==="in"?SPECIAL_IN:SPECIAL_OUT).map(([c,l])=>`<button class="chip spec" data-cat="${c}" aria-pressed="${c===st.cat}">${esc(l)}</button>`).join("");
  const openLoans=()=>S.cols.loans.filter(l=>loanLeft(l)>0);
  const guessLoan=a=>{const L=openLoans();const nm=String((d0&&d0.who)||"").toLowerCase();
    const nameOk=l=>nm&&String(l.name).toLowerCase().split(" ")[0]===nm.split(" ")[0];
    return (L.find(l=>nameOk(l)&&same(loanLeft(l),a))||L.find(l=>same(loanLeft(l),a))||L.find(nameOk)||{}).id||""};
  const extra=()=>{
    if(linkedLoan)return `<p class="note">Linked to your loan ${st.type==="in"?"from":"to"} <b>${esc(linkedLoan.name)}</b>. Delete this entry to undo that.</p>`;
    if(st.cat==="Borrowed")return `<div class="field"><label for="f-who">Who lent it</label><input id="f-who" maxlength="40" placeholder="e.g. Hamza" value="${esc((d0&&d0.who)||"")}"></div>
      <label class="tog"><input type="checkbox" id="f-plan" checked> Pay back from this salary</label><p class="note">It goes into Loans so you can see what you owe.</p>`;
    if(st.cat==="Loan repay"){const L=openLoans(),g=guessLoan(parseAmt($("f-amt")?$("f-amt").value:(d0&&d0.amount)));
      return `<div class="field"><label for="f-loan">Which loan</label><select id="f-loan"><option value="">A loan that isn't in Hisaab</option>${L.map(l=>`<option value="${l.id}" ${l.id===g?"selected":""}>${esc(l.name)} · ${esc(money(loanLeft(l)))} left</option>`).join("")}</select></div>`}
    if(st.cat==="To send back")return `<p class="note">It stays out of your income and shows as "Money to send back" until you send it. When you do, tag that payment <b>Sent back money</b>.</p>`;
    if(st.cat==="Sent back")return `<p class="note">This clears money you were holding for someone. It isn't counted as spending.</p>`;
    if(st.cat==="Lent")return `<p class="note">Not counted as spending. Write who you lent it to in the note.</p>`;
    return ""};
  const title=review?(st.type==="in"?"You got money":"You spent money"):t?"Edit entry":"Add money entry";
  openSheet(`<h3>${title}</h3>
  ${fromBank&&d0.who?`<p class="note" style="font-size:15px;color:var(--fg)">${st.type==="in"?"From":"At"} <b>${esc(d0.who)}</b> · ${esc(fmtDate(d0.date))}</p>`:""}
  ${fromBank?"":`<div class="seg" id="f-seg"><button data-type="out" aria-pressed="${st.type==="out"}">I spent</button><button class="inn" data-type="in" aria-pressed="${st.type==="in"}">I got money</button></div>`}
  ${amtField("f-amt",d0?d0.amount:"",!d0)}
  <div class="err" id="f-err"></div>
  <div id="f-kinds" ${linkedLoan?"hidden":""}>
    <div class="ql" id="f-q">${st.type==="in"?"What is this money?":"What was it for?"}</div>
    <div class="chips" id="f-chips">${chips()}</div>
    <div class="field" id="f-newtag" hidden><input id="f-tagname" maxlength="20" placeholder="New tag, e.g. Gym or Outing"></div>
    <div class="ql">Or</div>
    <div class="chips" id="f-specs">${specs()}</div>
  </div>
  <div id="f-extra">${extra()}</div>
  <div class="two"><div class="field"><label for="f-note">Short note</label><input id="f-note" placeholder="e.g. dinner with Musa" value="${esc(d0&&d0.note&&d0.note!==d0.who?d0.note:"")}" maxlength="60"></div>
  <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="${d0?d0.date:today()}"></div></div>
  <div class="chips" id="f-flag" ${st.type==="out"?"":"hidden"}><button class="chip" data-flag="important" aria-pressed="${st.flag==="important"}">★ Important</button><button class="chip" data-flag="waste" aria-pressed="${st.flag==="waste"}">Not needed</button></div>
  <button class="primary" id="f-save">${review?"Save":t?"Save changes":"Save"}</button>
  ${t?`<button class="ghost" id="f-del">${review?"Not a real payment, delete it":"Delete this entry"}</button>`:""}`,()=>{
    const redraw=()=>{$("f-chips").innerHTML=chips();$("f-specs").innerHTML=specs();$("f-extra").innerHTML=extra();
      $("f-q").textContent=st.type==="in"?"What is this money?":"What was it for?";$("f-flag").hidden=st.type!=="out"};
    const seg=$("f-seg");if(seg)seg.addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;st.type=b.dataset.type;st.cat="";
      sin.querySelectorAll("[data-type]").forEach(x=>x.setAttribute("aria-pressed",x===b));redraw()});
    $("f-kinds").addEventListener("click",e=>{
      if(e.target.closest("#f-addtag")){$("f-newtag").hidden=false;$("f-tagname").focus();return}
      const b=e.target.closest("[data-cat]");if(!b)return;st.cat=b.dataset.cat;$("f-newtag").hidden=true;redraw()});
    $("f-flag").addEventListener("click",e=>{const b=e.target.closest("[data-flag]");if(!b)return;st.flag=st.flag===b.dataset.flag?"":b.dataset.flag;
      sin.querySelectorAll("[data-flag]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.flag===st.flag))});
    const save=async()=>{
      const a=parseAmt($("f-amt").value);const err=$("f-err");
      if(!(a>0)){err.textContent="Enter an amount above 0.";return}
      const nt=$("f-tagname").value.trim();if(!$("f-newtag").hidden&&nt){st.cat=titleCase(nt).slice(0,20)}
      if(!st.cat){err.textContent=st.type==="in"?"Pick what this money is.":"Pick what it was for.";return}
      const who=$("f-who")?$("f-who").value.trim():"";
      if(st.cat==="Borrowed"&&!linkedLoan&&!who){err.textContent="Write who lent it.";return}
      const loanId=$("f-loan")?$("f-loan").value:"";const inPlan=$("f-plan")?$("f-plan").checked:true;
      const data={type:st.type,cat:st.cat,amount:a,note:$("f-note").value.trim()||(d0&&d0.who)||"",date:$("f-date").value||today(),flag:st.type==="out"?st.flag:"",reviewed:true};
      closeSheet();
      try{
        if(st.type==="out"&&!SPECIAL.includes(st.cat)&&!OUT.some(x=>x[0]===st.cat)&&!(S.prof.tags||[]).includes(st.cat))await setProf({tags:(S.prof.tags||[]).concat([st.cat])});
        let id;
        if(t){await upd("txns",t.id,data);id=t.id}
        else if(draft){const x=await saveImported(Object.assign({},draft,data));if(x.r==="dup"){toast("That payment is already added");return}id=x.id;if(x.r==="matched")await upd("txns",id,data)}
        else{const r=await recordTxn(data);id=r.id}
        if(!linkedLoan&&id){
          if(st.cat==="Borrowed")await add("loans",{name:who,amount:a,date:data.date,due:"",inPlan,paidBack:0,payments:[],inTxn:id,inPrev:null});
          if(st.cat==="Loan repay"&&loanId){const l=find("loans",loanId);if(l)await upd("loans",l.id,{paidBack:Math.round(((+l.paidBack||0)+a)*100)/100,payments:(l.payments||[]).concat([{a,d:data.date,t:id}])})}}
        if(merchant&&st.type==="out"&&!SPECIAL.includes(st.cat)&&st.cat!==origCat){const m=Object.assign({},S.prof.catMap||{});m[merchant]=st.cat;await setProf({catMap:m})}
        toast(st.cat==="Borrowed"?"Added to Loans":st.cat==="Loan repay"&&loanId?"Loan updated":review?"Saved as "+kindLabel(st.cat):(data.type==="in"?"Added ":"Spent ")+money(a));
        if(review)nextReview();
      }catch(e){toast(SAVE_ERR)}};
    $("f-save").onclick=save;onEnter(save);
    if(t)$("f-del").onclick=async()=>{closeSheet();const copy=Object.assign({},t);delete copy.id;
      try{
        if(linkedLoan){const ps=(linkedLoan.payments||[]).filter(x=>x.t===t.id);
          if(ps.length)await upd("loans",linkedLoan.id,{paidBack:Math.max(0,(+linkedLoan.paidBack||0)-sumBy(ps,x=>x.a)),payments:(linkedLoan.payments||[]).filter(x=>x.t!==t.id)})}
        await del("txns",t.id);
        toast(linkedLoan&&linkedLoan.inTxn===t.id?"Entry deleted. The loan is still in Loans.":"Entry deleted",linkedLoan?null:async()=>{await add("txns",copy)});
        if(review)nextReview();
      }catch(e){toast(SAVE_ERR)}};
  })}
function nextReview(){setTimeout(()=>{const n=pendingList().find(x=>!SKIP.has(x.id));if(n&&sheet.hidden)txSheet(n)},420)}

  ${amtField("p-amt",left,true)}

    const save=async()=>{const a=parseAmt($("p-amt").value);

        const before={paidBack:+l.paidBack||0,payments:(l.payments||[]).slice()};

    $("p-save").onclick=save;onEnter(save);

  <div class="err" id="y-err"></div>
  <p class="note">${esc(money(left))} left${b.once?"":" for "+esc(perLabel(p))}. You can pay part now and the rest later.</p>
  <button class="primary" id="y-save">Save payment</button>`,()=>{
    const save=async()=>{const a=parseAmt($("y-amt").value);
      if(!(a>0)){$("y-err").textContent="Enter an amount above 0.";return}
      if(a>left+0.005){$("y-err").textContent="That's more than the "+money(left)+" left.";return}
      closeSheet();
      try{const r=await recordTxn({type:"out",cat:"Bills",amount:a,note:b.name,date:today()});
        const before=paysOf(b,p);
        await upd("bills",b.id,{payments:before.concat([{p:p.key,a,t:r.id,prev:r.prev,d:today()}])});
        toast((r.matched?"Matched with your bank payment · ":"Paid ")+money(a),async()=>{await unrecord(r.id,r.prev);await upd("bills",b.id,{payments:before})})}catch(e){toast(SAVE_ERR)}};
    $("y-save").onclick=save;onEnter(save);
  })}

function loanSheet(l){
  const pays=(l&&l.payments)||[];const inPlan=!l||l.inPlan!==false;
  openSheet(`<h3>${l?"Edit loan":"Add a loan"}</h3>
  <div class="field"><label for="l-name">Who lent you</label><input id="l-name" placeholder="e.g. Bilal" value="${esc(l?l.name:"")}" maxlength="40" ${l?"":"autofocus"}></div>
  <div class="field"><label for="l-amt">Amount borrowed</label><input id="l-amt" inputmode="decimal" placeholder="0" value="${l?l.amount:""}"></div>
  <div class="two"><div class="field"><label for="l-date">Borrowed on</label><input id="l-date" type="date" value="${l?(l.date||""):today()}"></div>
  <div class="field"><label for="l-due">Pay back by</label><input id="l-due" type="date" value="${l&&l.due?l.due:""}"></div></div>
  <label class="tog"><input type="checkbox" id="l-plan" ${inPlan?"checked":""}> Pay back from this salary</label>
  ${l?"":`<label class="tog"><input type="checkbox" id="l-in"> I just got this money (add it to In hand)</label>`}
  <div class="err" id="l-err"></div>
  ${pays.length?`<div class="box"><h4>Paid back</h4><div class="hist">${pays.map(x=>`<div><span>${esc(fmtDate(x.d))}</span><span class="num">${esc(money(x.a))}</span></div>`).join("")}</div></div>`:""}
  <button class="primary" id="l-save">${l?"Save changes":"Add loan"}</button>
  ${l?'<button class="ghost" id="l-del">Delete this loan</button>':""}`,()=>{
    const save=async()=>{const name=$("l-name").value.trim();const a=parseAmt($("l-amt").value);const err=$("l-err");
      if(!name){err.textContent="Write who lent you the money.";return}
      if(!(a>0)){err.textContent="Enter the amount you borrowed.";return}
      const data={name,amount:a,date:$("l-date").value||(l?"":today()),due:$("l-due").value||"",inPlan:$("l-plan").checked};
      const addIn=!l&&$("l-in").checked;
      closeSheet();
      try{if(l)await upd("loans",l.id,data);
        else{let tid="",prev=null;if(addIn){const r=await recordTxn({type:"in",cat:"Borrowed",amount:a,note:"From "+name,date:data.date});tid=r.id;prev=r.prev}
          await add("loans",Object.assign(data,{paidBack:0,payments:[],inTxn:tid,inPrev:prev}))}}catch(e){toast(SAVE_ERR)}};
    $("l-save").onclick=save;onEnter(save);
    if(l)$("l-del").onclick=async()=>{closeSheet();const copy=Object.assign({},l);delete copy.id;
      try{await del("loans",l.id);toast("Loan deleted",async()=>{await add("loans",copy)})}catch(e){toast(SAVE_ERR)}};
  })}

function explainSheet(){
  const P=plan(),lab=perLabel(P.p);
  openSheet(`<h3>How Home works</h3>
  <div class="box"><h4>In hand · ${esc(money(P.inHand))}</h4><div class="note">All money that came in minus all money that went out. It should match what's in your Meezan account. If it doesn't, tap <b>Fix</b> once and enter the real amount.</div></div>
  <div class="box"><h4>− Still to pay · ${esc(money(P.toPay))}</h4><div class="note">What you still have to pay from this salary (${esc(lab)}): bills, one-time payments, loans you're paying back, and your To buy list. It goes down every time you tap <b>Pay</b>.</div></div>
  <div class="box"><h4>= Safe to spend · ${esc(money(P.safe))}</h4><div class="note">What's left after all of that. Spend only this until your next salary and you won't need to borrow. The "a day" number spreads it over the days left.</div></div>
  <button class="primary" id="e-fix">Fix In hand now</button><button class="plain" id="e-ok">Close</button>`,()=>{
    $("e-ok").onclick=closeSheet;$("e-fix").onclick=()=>{closeSheet();setTimeout(fixSheet,260)}})}
function fixSheet(first){
  const P=plan();
  openSheet(`<h3>${first?"Last step: your balance":"Fix money in hand"}</h3>
  <p class="note" style="font-size:15px;color:var(--fg)">How much is in your Meezan account (plus any cash) right now? Your Meezan app shows it.</p>
  ${amtField("x-amt",Math.round(P.inHand*100)/100,true)}
  <div class="err" id="x-err"></div>
  <p class="note">Hisaab adds one Balance fix entry for the difference. It doesn't count as spending or income.</p>
  <button class="primary" id="x-save">Save</button>`,()=>{
    const save=async()=>{const a=parseAmt($("x-amt").value.replace("−","-"));
      if(!isFinite(a)){$("x-err").textContent="Enter a number.";return}
      const d=Math.round((a-P.inHand)*100)/100;closeSheet();
      if(Math.abs(d)<0.01){toast("In hand already matches");return}
      try{const id=await add("txns",{type:d>0?"in":"out",cat:FIX,amount:Math.abs(d),note:"Balance fixed",date:today()});
        try{localStorage.setItem(GUIDE,"1")}catch(e){}
        toast("In hand is now "+money(a),async()=>{await del("txns",id)})}catch(e){toast(SAVE_ERR)}};
    $("x-save").onclick=save;onEnter(save);
  })}

function seedSheet(){
  const p=PER(),lab=perLabel(p);const items=[];
  const same2=(a,b)=>String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
  const has=(col,n,f)=>S.cols[col].some(x=>(!f||f(x))&&same2(x.name,n));
  SEED.bills.forEach(([n,a,re])=>{const ex=S.cols.bills.find(b=>!b.once&&re.test(b.name||""));
    items.push({g:"Bills (every salary)",col:"bills",n:ex?ex.name:n,a,ex,on:true,sub:ex?"Updates your "+ex.name+" bill (was "+money(ex.amount)+")":"For "+lab})});
  SEED.once.forEach(([n,a])=>{const d=has("bills",n);items.push({g:"One-time payments",col:"once",n,a,on:!d,sub:d?"Already in Bills":"Paid once, then gone"})});
  SEED.loans.forEach(([n,a])=>{const d=has("loans",n);items.push({g:"Loans to pay back",col:"loans",n,a,on:!d,sub:d?"Already in Loans":"Pay back from this salary"})});
  SEED.buy.forEach(([n,a])=>{const d=has("buy",n,i=>!i.done);items.push({g:"To buy",col:"buy",n,a,on:!d,sub:d?"Already on your list":""})});
  const groups=[...new Set(items.map(i=>i.g))];
  const total=()=>sumBy(items.filter((x,i)=>{const c=$("sd-"+i);return c?c.checked:x.on}),x=>x.a);
  openSheet(`<h3>Your plan for ${esc(lab)}</h3>
  <p class="note">Untick anything you don't want. Every amount can be changed later by tapping it.</p>
  ${groups.map(g=>`<div class="sec"><div class="sechead"><h2 style="font-size:16px">${esc(g)}</h2></div><div>${items.map((x,i)=>x.g!==g?"":`<label class="pick"><input type="checkbox" id="sd-${i}" ${x.on?"checked":""}><span class="mid"><span class="t">${esc(x.n)}</span>${x.sub?`<span class="s">${esc(x.sub)}</span>`:""}</span><span class="num amt">${esc(money(x.a))}</span></label>`).join("")}</div></div>`).join("")}
  <div class="box"><div class="note">I read "rent 56000 x2" as <b>Rs 56,000 for both months</b> of this salary, the same for Ayaz uncle, Fee and Gym. If it's that much <b>each month</b>, double the amount on the Bills tab.</div></div>
  <div class="sechead"><h2 style="font-size:16px">Total</h2><span class="num" id="sd-tot" style="font-family:var(--display);font-weight:800;font-size:18px">${esc(money(total()))}</span></div>
  <button class="primary" id="sd-add">Add selected</button><button class="plain" id="sd-no">Cancel</button>`,()=>{
    sin.querySelectorAll(".pick input").forEach(c=>c.onchange=()=>{$("sd-tot").textContent=money(total())});
    $("sd-no").onclick=closeSheet;
    $("sd-add").onclick=async()=>{const pick=items.filter((x,i)=>$("sd-"+i).checked);closeSheet();
      try{for(const x of pick){
          if(x.col==="bills"){if(x.ex)await upd("bills",x.ex.id,{amount:x.a,once:false});else await add("bills",{name:x.n,amount:x.a,day:0,once:false,payments:[]})}
          else if(x.col==="once")await add("bills",{name:x.n,amount:x.a,day:0,once:true,payments:[]});
          else if(x.col==="loans")await add("loans",{name:x.n,amount:x.a,date:"",due:"",inPlan:true,paidBack:0,payments:[],inTxn:"",inPrev:null});
          else await add("buy",{name:x.n,amount:x.a,note:"",done:false,txnId:"",txnPrev:null})}
        const t=Object.assign({},S.prof.tabs);if(pick.some(x=>x.col==="bills"||x.col==="once"))t.bills=true;if(pick.some(x=>x.col==="loans"))t.loans=true;if(pick.some(x=>x.col==="buy"))t.buy=true;
        await setProf({seeded:SEED.id,tabs:t});toast("Added "+pick.length+" items to your plan")}catch(e){toast(SAVE_ERR)}};
  })}

function settingsSheet(){
  const last=SMS.last?new Date(SMS.last.t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  const sal=S.prof.salary,cur=mIdx(MK()),per=PER();let every=+sal.every===1?1:2;
  const tabsBox=`<div class="box"><h4>Tabs</h4><div class="note">Turn off what you don't need. A tab that's off is hidden and left out of Safe to spend. Nothing is deleted.</div>
    <div>${[["bills","Bills"],["savings","Savings"],["loans","Loans"],["buy","To buy"],["history","History"]].map(([k,l])=>`<label class="sw"><span>${l}</span><input type="checkbox" data-tabsw="${k}" ${tabOn(k)?"checked":""}></label>`).join("")}</div></div>`;
  const salBox=`<div class="box"><h4>Salary</h4>
    <div class="seg" id="s-every"><button data-ev="1" aria-pressed="${every===1}">Every month</button><button data-ev="2" aria-pressed="${every===2}">Every 2 months</button></div>
    <div class="field" id="s-startf" ${every===2?"":"hidden"}><label for="s-start">This salary covers</label><select id="s-start">${[cur-1,cur].map(i=>`<option value="${mKey(i)}" ${per.L===2&&per.start===i?"selected":""}>${esc(perLabel({start:i,end:i+1,L:2}))}</option>`).join("")}</select></div></div>`;
  const autoBox=!canSms()?"":SMS.on&&hasSms()?`<div class="box"><h4>${bankName()} SMS: on</h4>
      <div class="note">New ${bankName()} payments show up on Home each time you open the app, so you can tag them.${last?" Last checked "+esc(last)+".":""}</div>
      <div class="field"><label for="s-snd">Read messages from</label><input id="s-snd" value="${esc(SMS.senders)}"></div>
      <div class="acts"><button class="plain" id="s-scan">Check now</button><button class="ghost" id="s-off">Turn off</button></div></div>`
    :`<div class="box"><h4>Meezan Bank SMS</h4>
      <div class="note">Add Meezan payments and money received automatically, from this salary's SMS onward. Messages stay on your phone.</div>
      <button class="primary" id="s-on">Turn on</button></div>`;
  const pasteBox=`<div class="box"><h4>Add from bank messages</h4>
    <div class="note">${NATIVE?"In your Messages app, long-press a Meezan message, tap <b>Share</b>, then pick <b>Hisaab</b>. Or paste":"Paste"} one or more bank messages here.</div>
    <div class="field"><label for="s-msg">Messages</label><textarea id="s-msg" rows="3" placeholder="PKR 3,711.00 charged at …"></textarea></div>
    <div class="acts"><button class="plain" id="s-imp">Add these</button></div></div>`;
  const backupBox=S.mode==="local"?`<div class="box"><h4>Backup</h4><div class="note">Save all your Hisaab data${NATIVE&&NATIVE.shareText?" by sending it to yourself, for example on WhatsApp or Drive":" by copying it"}. To restore, paste that backup in the messages box above.</div>
      <div class="acts"><button class="plain" id="s-bak">Back up now</button></div></div>`:"";
  const switchBox=canSms()&&SMS.bank==="easypaisa"?`<div class="box"><h4>Use Meezan Bank</h4><div class="note">Hisaab still reads Easypaisa messages.</div><button class="primary" data-act="meezan">Switch to Meezan</button></div>`:"";
  openSheet(`<h3>Settings</h3>
  ${switchBox}${tabsBox}${salBox}${autoBox}${pasteBox}${backupBox}
  <div class="field"><label for="s-cur">Currency label</label><input id="s-cur" value="${esc(S.prof.cur)}" maxlength="5" placeholder="Rs"></div>
  <p class="note">${S.mode==="db"?"Your entries are saved to your Claude account, so they're here on any device you open this on.":"Your entries are saved on this phone. Uninstalling the app deletes them."}</p>
  ${NATIVE&&NATIVE.version?`<div class="box"><h4>App version ${esc(NATIVE.version())}</h4><div class="note">${(()=>{let i={};try{i=JSON.parse(NATIVE.updateInfo?NATIVE.updateInfo():"{}")}catch(e){}
      return (i.state==="available"?"Hisaab "+esc(i.latest)+" is ready to install. ":"")+(i.lastCheck?"Last checked "+esc(new Date(i.lastCheck).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+".":"Hisaab checks for updates each time you open it.")})()}</div>
    ${NATIVE.checkUpdate?`<div class="acts"><button class="plain" data-act="upd">Check for updates</button></div>`:""}</div>`:""}
  <button class="primary" id="s-save">Save</button>`,()=>{
    sin.querySelectorAll("[data-tabsw]").forEach(x=>x.onchange=async()=>{const t=Object.assign({},S.prof.tabs);t[x.dataset.tabsw]=x.checked;try{await setProf({tabs:t})}catch(e){toast(SAVE_ERR)}});
    $("s-every").addEventListener("click",e=>{const x=e.target.closest("[data-ev]");if(!x)return;every=+x.dataset.ev;
      sin.querySelectorAll("[data-ev]").forEach(y=>y.setAttribute("aria-pressed",y===x));$("s-startf").hidden=every!==2});
    const on=$("s-on");if(on)on.onclick=turnOnSms;
    const off=$("s-off");if(off)off.onclick=()=>{SMS.on=false;saveSms();closeSheet();toast(bankName()+" SMS turned off")};
    const sc=$("s-scan");if(sc)sc.onclick=()=>{const v=$("s-snd").value.trim();if(v)SMS.senders=v;saveSms();closeSheet();scanSms(true)};
    const bk=$("s-bak");if(bk)bk.onclick=async()=>{const t=backupText();
      if(NATIVE&&NATIVE.shareText){try{NATIVE.shareText(t)}catch(e){}return}
      try{await navigator.clipboard.writeText(t);toast("Backup copied. Paste it somewhere safe.")}catch(e){$("s-msg").value=t;$("s-msg").select();toast("Copy the selected text and keep it somewhere safe.")}};
    $("s-imp").onclick=()=>{const v=$("s-msg").value.trim();if(!v){toast("Paste a message first.");return}closeSheet();setTimeout(()=>importText(v),260)};
    $("s-save").onclick=async()=>{const c=$("s-cur").value.trim()||"Rs";const snd=$("s-snd");if(snd&&snd.value.trim()){SMS.senders=snd.value.trim();saveSms()}
      const salary={every,start:every===2?$("s-start").value:MK()};
      closeSheet();try{await setProf({cur:c,salary})}catch(e){toast(SAVE_ERR)}}})}

/* ---------- actions ---------- */
const find=(c,id)=>S.cols[c].find(x=>x.id===id);
document.addEventListener("click",async e=>{
  const tb=e.target.closest("[data-tab]");
  if(tb){S.tab=tb.dataset.tab;try{localStorage.setItem("hisaab.tab",S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-act]");if(!a)return;const id=a.dataset.id;
  switch(a.dataset.act){
    case"settings":settingsSheet();break;
    case"explain":explainSheet();break;
    case"guide-ok":try{localStorage.setItem(GUIDE,"1")}catch(_){}render();break;
    case"fix":fixSheet();break;
    case"upd":closeSheet();try{NATIVE.checkUpdate();toast("Checking for updates…")}catch(_){toast("Updates work in the phone app.")}break;
    case"meezan":closeSheet();setTimeout(meezanSheet,sheet.hidden?0:260);break;
    case"review":txSheet(find("txns",id));break;
    case"qspec":txSheet(find("txns",id),null,{cat:a.dataset.cat});break;
    case"later":SKIP.add(id);render();break;
    case"qtag":{const t=find("txns",id);if(!t)break;const cat=a.dataset.cat;const prev={cat:t.cat,reviewed:false};
      try{await upd("txns",id,{cat,reviewed:true});
        if(t.merchant&&t.type==="out"&&cat!==prev.cat){const m=Object.assign({},S.prof.catMap||{});m[t.merchant]=cat;await setProf({catMap:m})}
        toast("Tagged "+cat,async()=>{await upd("txns",id,prev)})}catch(_){toast(SAVE_ERR)}break}
    case"seed":seedSheet();break;
    case"seed-skip":try{await setProf({seeded:SEED.id})}catch(_){toast(SAVE_ERR)}break;
    case"edit-tx":txSheet(find("txns",id));break;
    case"pay":{const b=find("bills",id);if(b)paySheet(b);break}
    case"new-bill":billSheet();break;
    case"edit-bill":billSheet(find("bills",id));break;
    case"new-sav":savSheet();break;
    case"edit-sav":savSheet(find("savings",id));break;
    case"move-sav":moveSheet(find("savings",id));break;
    case"new-loan":loanSheet();break;
    case"edit-loan":loanSheet(find("loans",id));break;
    case"repay":repaySheet(find("loans",id));break;
    case"new-buy":buySheet();break;
    case"edit-buy":buySheet(find("buy",id));break;
    case"bought":buySheet(find("buy",id),true);break;
    case"clear-bought":{for(const i of S.cols.buy.filter(i=>i.done)){try{await del("buy",i.id)}catch(_){toast(SAVE_ERR);break}}break}
  }
});
document.getElementById("fab").onclick=()=>txSheet();

let tt;const toastEl=document.getElementById("toast"),undoBtn=document.getElementById("toastundo");
function toast(msg,undo){document.getElementById("toastmsg").textContent=msg;undoBtn.hidden=!undo;
  undoBtn.onclick=async()=>{toastEl.classList.remove("show");try{await undo()}catch(e){toast(SAVE_ERR)}};
  toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),undo?5000:2600)}

/* say so after an update installed */
(()=>{if(!NATIVE||!NATIVE.version)return;try{const v=NATIVE.version(),old=localStorage.getItem("hisaab.ver");localStorage.setItem("hisaab.ver",v);
  if(old&&old!==v)setTimeout(()=>toast("Updated to Hisaab "+v),800)}catch(e){}})();
window.hisaabBack=function(){if(!sheet.hidden){closeSheet();return true}if(S.tab!=="home"){S.tab="home";try{localStorage.setItem("hisaab.tab","home")}catch(_){}render();window.scrollTo(0,0);return true}return false};
if(normProf()&&S.mode==="local")saveLocal();
render();connect();
</script>
</body></html>
