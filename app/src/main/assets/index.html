<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Hisaab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, soft dusty-peach summary card on warm dark ground, fixed bottom tabs + floating add button */
:root{
  --bg:#1b1715; --surface:#252019; --surface2:#2e2823; --line:#3a332d;
  --fg:#e8e0d8; --muted:#9a8f86; --peach:#d9b6a1; --ink:#2f1d14; --ink-soft:#6b4a3a; --short:#7f3523;
  --accent:#d9a588; --good:#9cc4a6; --bad:#d99a8c; --warn:#d2b47a;
  --c1:#cf9a82; --c2:#cdb27e; --c3:#97b89e; --c4:#8eabc4; --c5:#a99cc0; --c6:#c497a5; --c7:#a39a92; --c8:#88b5ad; --c9:#b3b58c;
  --display:"Urbanist",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5f0eb; --surface:#fcfaf7; --surface2:#ede5dd; --line:#e2d8ce;
  --fg:#3a2d26; --muted:#85776d; --peach:#e3c4b1; --ink:#2f1d14; --ink-soft:#6b4a3a; --short:#8a3a26;
  --accent:#a8613f; --good:#4f7f5c; --bad:#a9503e; --warn:#8f6a1f;
  --c1:#c0866b; --c2:#b8995a; --c3:#6f9878; --c4:#6c8eab; --c5:#8a7cab; --c6:#ab7486; --c7:#93887f; --c8:#5f958c; --c9:#878c52;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f5f0eb; --surface:#fcfaf7; --surface2:#ede5dd; --line:#e2d8ce;
  --fg:#3a2d26; --muted:#85776d; --peach:#e3c4b1; --ink:#2f1d14; --ink-soft:#6b4a3a; --short:#8a3a26;
  --accent:#a8613f; --good:#4f7f5c; --bad:#a9503e; --warn:#8f6a1f;
  --c1:#c0866b; --c2:#b8995a; --c3:#6f9878; --c4:#6c8eab; --c5:#8a7cab; --c6:#ab7486; --c7:#93887f; --c8:#5f958c; --c9:#878c52;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.coin{width:38px;height:38px;border-radius:12px;background:var(--peach);display:grid;place-items:center;color:var(--ink)}
.brand h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.greet{font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted);margin:0;line-height:1.35;text-wrap:balance}
.greet b{color:var(--fg);font-weight:700}

.card{background:var(--peach);color:var(--ink);border-radius:28px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.card .lbl{font-family:var(--display);font-weight:700;font-size:16px;opacity:.85}
.card .big{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .k{font-size:13px;color:var(--ink-soft);font-weight:600}
.split .v{font-family:var(--display);font-weight:800;font-size:19px}
.after{border-top:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding-top:12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.after.short{color:var(--short)}
.pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}

.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.sechead .aside{color:var(--muted);font-size:13px}
.link{color:var(--accent);font-weight:600;font-size:14px}

.list{background:var(--surface);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;min-height:60px}
.row+.row{border-top:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.amt.in{color:var(--good)}
.dot{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--bg)}
.daylbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 4px 0}

.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.legend .a{font-weight:600}

.paybtn{background:var(--peach);color:var(--ink);font-weight:700;font-size:13.5px;border-radius:99px;padding:8px 14px;white-space:nowrap}
.paid{color:var(--good);font-weight:700;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.s.over{color:var(--bad)} .s.soon{color:var(--warn)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--ink)}
.check.on{background:var(--good);border-color:var(--good);color:var(--bg)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:600;width:100%}

.empty{background:var(--surface);border-radius:22px;padding:26px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-size:17px}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px 16px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:800;font-size:22px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--muted);font-size:11.5px;font-weight:600;min-width:0}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--peach);color:var(--ink);border-radius:20px;height:58px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
@media (min-width:560px){.fab{right:calc(50% - 250px)}}

.scrim{position:fixed;inset:0;background:rgba(10,6,4,.55);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:28px 28px 0 0;max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.show{transform:none}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:16px;padding:4px}
.seg button{padding:10px;border-radius:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.seg button.inn[aria-pressed="true"]{color:var(--good)}
.amtfield{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amtfield:focus-within{border-color:var(--accent)}
.amtfield span{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted)}
.amtfield input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--display);font-weight:800;font-size:42px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:none;width:100%;font:inherit;color:var(--fg);resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.box .field textarea{background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--peach);color:var(--ink);font-family:var(--display);font-weight:800;font-size:17px;border-radius:18px;padding:16px}
.ghost{color:var(--bad);font-weight:600;padding:10px}
.plain{color:var(--accent);font-weight:600;padding:10px}
.err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:1em;margin-top:-8px}
.note{color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:.2s;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--peach);font-weight:800;filter:brightness(.8)}
.prog{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:7px}
.prog span{display:block;height:100%;border-radius:9px;background:var(--good)}
.tog{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border-radius:14px;font-weight:500;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.box{background:var(--surface2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.box h4{margin:0;font-family:var(--display);font-size:16px;font-weight:700}
.box .acts{display:flex;gap:6px;flex-wrap:wrap}
.box .acts button{padding:8px 0;margin-right:14px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.title{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"><p class="loading">Opening your hisaab…</p></div>

<button class="fab" id="fab" aria-label="Add money entry">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add
</button>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="bills"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Bills</button>
  <button data-tab="savings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8M9 3v3L6 9v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9l-3-3V3"/><path d="M9 14h6"/></svg>Savings</button>
  <button data-tab="loans"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>Loans</button>
  <button data-tab="buy"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 11.2A2 2 0 0 1 15.8 20H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>To buy</button>
</div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast" role="status"><span id="toastmsg"></span><button id="toastundo" hidden>Undo</button></div>

<script>
const OUT=[["Food","--c1"],["Transport","--c4"],["Shopping","--c5"],["Bills","--c2"],["Loan repay","--c6"],["Family","--c3"],["Health","--c8"],["Savings","--c9"],["Other","--c7"]];
const IN=[["Salary","--c3"],["Top-up","--c4"],["Borrowed","--c6"],["From savings","--c9"],["Gift","--c5"],["Other","--c7"]];
const catColor=(type,c)=>{const l=type==="in"?IN:OUT;const f=l.find(x=>x[0]===c);return "var("+(f?f[1]:"--c7")+")"};
const COLS=["txns","bills","buy","savings","loans"];
const blank=()=>({txns:[],bills:[],buy:[],savings:[],loans:[]});
const NATIVE=window.HisaabNative||null;

const S={cols:blank(),prof:{cur:"Rs",catMap:{}},mode:"local",root:null,tab:"home",loading:!!(window.claude&&window.claude.use)};
const LS="hisaab.v1";
try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d){S.cols=Object.assign(blank(),d.cols);S.prof=Object.assign({cur:"Rs",catMap:{}},d.prof)}}catch(e){}
try{const t=localStorage.getItem("hisaab.tab");if(t)S.tab=t}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({cols:S.cols,prof:S.prof}))}catch(e){}}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const SAVE_ERR="Couldn't save that. Check your internet and try again.";

async function add(col,data){const id=newId();data.created=Date.now();
  if(S.mode==="db"){await S.root.collection(col).doc(id).set(data)}else{S.cols[col].push(Object.assign({id},data));saveLocal();render()}return id}
async function upd(col,id,patch){
  if(S.mode==="db"){await S.root.collection(col).doc(id).update(patch)}else{const x=S.cols[col].find(r=>r.id===id);if(x)Object.assign(x,patch);saveLocal();render()}}
async function del(col,id){
  if(S.mode==="db"){await S.root.collection(col).doc(id).delete()}else{S.cols[col]=S.cols[col].filter(r=>r.id!==id);saveLocal();render()}}
async function setProf(p){Object.assign(S.prof,p);
  if(S.mode==="db"){await S.root.set(JSON.parse(JSON.stringify(S.prof)))}else{saveLocal();render()}}

async function connect(){
  if(!(window.claude&&window.claude.use)){S.loading=false;render();checkShared();scanSms();return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){S.loading=false;render();return}
    S.root=db.doc("data/users/"+uid+"/profile");S.mode="db";S.cols=blank();
    let waiting=COLS.length+1;const first=()=>{if(--waiting<=0){S.loading=false}render()};
    COLS.forEach(c=>{let f=true;S.root.collection(c).onSnapshot(s=>{S.cols[c]=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(f){f=false;first()}else render()},()=>toast("Lost the connection to your saved data. Reload the page."))});
    let pf=true;S.root.onSnapshot(s=>{if(s.exists)S.prof=Object.assign({cur:"Rs",catMap:{}},s.data());if(pf){pf=false;first()}else render()},()=>{});
  }catch(e){S.mode="local";S.loading=false;render()}
}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dstr(new Date());
const MK=()=>today().slice(0,7);
const pdate=ds=>{const [Y,M,D]=(ds||today()).split("-").map(Number);return new Date(Y,M-1,D)};
const dayDiff=(a,b)=>Math.abs(Math.round((pdate(a)-pdate(b))/864e5));
const fmtDate=ds=>pdate(ds).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const monthStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("en-US",{maximumFractionDigits:2});
const money=v=>{const n=Number(v)||0;return (n<0?"−":"")+S.prof.cur+" "+nf.format(Math.abs(n))};
const ord=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[, ]/g,""));return isFinite(n)?Math.round(n*100)/100:NaN};
const same=(a,b)=>Math.abs((+a||0)-(+b||0))<0.005;
const titleCase=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
function dayLabel(ds){const t=today();const y=dstr(new Date(Date.now()-864e5));if(ds===t)return"Today";if(ds===y)return"Yesterday";
  return pdate(ds).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
const ICON={
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  note:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="2.6"/><path d="M6.2 9.6h.01M17.8 14.4h.01"/></svg>',

/* Recording money: a manual entry that matches an Easypaisa entry (same amount, within 2 days) updates that entry instead of adding a duplicate. */
async function recordTxn(data){
  const m=S.cols.txns.find(t=>t.ref&&!t.linked&&t.type===data.type&&same(t.amount,data.amount)&&dayDiff(t.date,data.date)<=2);
  if(m){const prev={cat:m.cat,note:m.note||"",linked:false};await upd("txns",m.id,{cat:data.cat,note:data.note||m.note||"",linked:true});return{id:m.id,prev,matched:true}}
  const id=await add("txns",data);return{id,prev:null,matched:false}}
async function unrecord(id,prev){if(!id)return;if(prev)await upd("txns",id,prev);else await del("txns",id)}

/* ---------- Easypaisa messages (shared or pasted) ---------- */
const GUESS=[[/TEA|CAFE|COFFEE|FOOD|KFC|MCDONALD|PIZZA|BURGER|BIRYANI|RESTAURANT|BAKERY|BAKERS|SWEETS|DHABA|HOTEL|MART|GROCER|STORE|SUPER ?MARKET|CHAYE|CHAI/,"Food"],
  [/FUEL|PETROL|PSO|SHELL|TOTAL|ATTOCK|CAREEM|UBER|INDRIVE|BYKEA|YANGO|METRO BUS/,"Transport"],
  [/PHARM|MEDIC|HOSPITAL|CLINIC|LAB\b|DENTAL/,"Health"],
  [/JAZZ|ZONG|TELENOR|UFONE|ELECTRIC|LESCO|SNGPL|SSGC|PTCL|NAYATEL|WATER|INTERNET|NETFLIX/,"Bills"],
  [/DARAZ|OUTFITTERS|KHAADI|SAPPHIRE|J\.|BATA|SERVIS|MALL|SHOP/,"Shopping"]];
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function msgDate(b,ms){let m;
  if(m=b.match(/\b(20\d\d)-(\d\d)-(\d\d)\b/))return m[1]+"-"+m[2]+"-"+m[3];
  if(m=b.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](20\d\d)\b/))return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  if(m=b.match(/\b(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ](20\d\d)\b/)){const mo=MON[m[2].toLowerCase()];if(mo)return m[3]+"-"+pad(mo)+"-"+pad(m[1])}
  return ms?dstr(new Date(+ms)):today()}
function parseSms(body,ms){
  const b=String(body||"");
  if(/fail|unsuccess|declin|revers|\botp\b|one.time|verification|\bpin\b|tokeni/i.test(b))return null;
  const am=b.match(/(?:rs\.?|pkr)\s*([\d,]+(?:\.\d{1,2})?)/i);if(!am)return null;
  const amount=parseFloat(am[1].replace(/,/g,""));if(!(amount>0))return null;
  const OUTRE=/\b(paid|sent|charged|debited|withdrawn|withdrawal|transferred|purchase|deducted|spent)\b/i,INRE=/\b(received|credited|deposited|cash ?in|refunded|refund)\b/i;
  const o=b.search(OUTRE),i=b.search(INRE);if(o<0&&i<0)return null;
  const type=o<0?"in":i<0?"out":(o<i?"out":"in");
  const rest=b.slice(am.index);
  const STOP="(?=\\s{2,}|\\s+on\\s|\\s+via\\s|\\s+for\\s|\\s+from\\s|,|\\.\\s|\\.$|\\(|\\s+A\\/C|\\s+AC#|\\s+account|$)";
  const r=rest.match(new RegExp(type==="out"?"\\b(?:at|to)\\s+(.+?)"+STOP:"\\bfrom\\s+(.+?)"+STOP,"i"));
  let who=r?r[1].trim().replace(/\s+PK$/i,"").replace(/\s+(LHR|LAHORE|KHI|KARACHI|ISB|ISLAMABAD|RWP|RAWALPINDI|FSD|FAISALABAD|MULTAN|PESHAWAR|PSH)(\s+CITY)?$/i,"").trim():"";if(/^\d/.test(who))who="";who=who.slice(0,40);
  const key=who.toUpperCase();
  const idm=b.match(/(?:txn\s*id|trx\s*id|transaction\s*id|\btid)\s*[:#.]?\s*([A-Z0-9]{5,})/i);
  const date=msgDate(b,ms);const ref="sms:"+(idm?idm[1]:date+":"+amount+":"+b.length);
  let cat=type==="in"?"Top-up":"Other";
  if(type==="out"&&key){if(S.prof.catMap&&S.prof.catMap[key])cat=S.prof.catMap[key];else{const g=GUESS.find(([re])=>re.test(key));if(g)cat=g[1]}}
  return{type,amount,cat,merchant:key,note:who?titleCase(who):(type==="in"?"Money in":"Easypaisa payment"),ref,date}}
function splitMsgs(text){return String(text||"").split(/\n\s*\n|(?=\bTxn ID\b)/i).map(x=>x.trim()).filter(Boolean)}
async function saveImported(p){
  if(S.cols.txns.some(t=>t.ref===p.ref))return"dup";
  const man=S.cols.txns.find(t=>!t.ref&&t.type===p.type&&same(t.amount,p.amount)&&dayDiff(t.date,p.date)<=2);
  if(man){await upd("txns",man.id,{ref:p.ref,src:"easypaisa",merchant:p.merchant,linked:true});return"matched"}
  await add("txns",{type:p.type,cat:p.cat,amount:p.amount,note:p.note,date:p.date,ref:p.ref,src:"easypaisa",merchant:p.merchant,linked:false});return"added"}
async function importText(text){
  if(isBackup(text)){restoreSheet(String(text).trim());return}
  const parsed=splitMsgs(text).map(m=>parseSms(m)).filter(Boolean);
  if(!parsed.length){toast("Couldn't find a payment in that message.");return}
  if(parsed.length===1){const p=parsed[0];if(S.cols.txns.some(t=>t.ref===p.ref)){toast("That payment is already added");return}txSheet(null,p);return}
  let added=0,dup=0;
  try{for(const p of parsed){const r=await saveImported(p);if(r==="added")added++;else dup++}}catch(e){toast(SAVE_ERR);return}
  toast("Added "+added+" payment"+(added===1?"":"s")+(dup?" · "+dup+" already there":""))}
/* automatic reading (phone app with SMS access) */
const SMSK="hisaab.sms";
const SMS={on:false,since:0,senders:"3737, easypaisa",last:null};
try{Object.assign(SMS,JSON.parse(localStorage.getItem(SMSK)||"{}"))}catch(e){}
function saveSms(){try{localStorage.setItem(SMSK,JSON.stringify({on:SMS.on,since:SMS.since,senders:SMS.senders,last:SMS.last}))}catch(e){}}
const canSms=()=>!!(NATIVE&&NATIVE.readSms);
const hasSms=()=>{try{return canSms()&&NATIVE.hasSms()}catch(e){return false}};
let scanning=false;
async function scanSms(full){
  if(!SMS.on||!hasSms()||scanning||S.mode!=="local")return;
  scanning=true;let added=0;
  try{
    const since=full?monthStart():(SMS.since||monthStart());
    const list=JSON.parse(NATIVE.readSms(since,SMS.senders)||"[]");let max=SMS.since||0;
    for(const m of list){if(+m.date>max)max=+m.date;const p=parseSms(m.body,m.date);if(!p)continue;if((await saveImported(p))==="added")added++}
    SMS.since=max;SMS.last={t:Date.now(),added};saveSms();
    if(added)toast("Added "+added+" from Easypaisa");else if(full)toast("Easypaisa is up to date");
  }catch(e){toast("Couldn't read Easypaisa messages. Try Check now in Settings.")}
  scanning=false}
window.hisaabSmsResult=(granted,blocked)=>{
  if(granted){SMS.on=true;SMS.since=monthStart();saveSms();closeSheet();scanSms(true);return}
  if(blocked)restrictedHelp();else toast("Hisaab needs SMS access to read Easypaisa messages.")};
function turnOnSms(){if(hasSms()){SMS.on=true;SMS.since=monthStart();saveSms();closeSheet();scanSms(true)}else NATIVE.requestSms()}
function restrictedHelp(){
  openSheet(`<h3>Allow SMS access</h3>
  <p class="note" style="font-size:15px;color:var(--fg)">Android locks SMS access for apps installed from a file until you unlock it once.</p>
  <div class="box"><div>1. Tap <b>Open app settings</b> below.</div><div>2. Tap <b>⋮</b> at the top right, then <b>Allow restricted settings</b>.</div><div>3. Tap <b>Permissions → SMS → Allow</b>, then come back here.</div></div>
  <button class="primary" id="r-open">Open app settings</button>`,()=>{$("r-open").onclick=()=>{closeSheet();try{NATIVE.openAppSettings()}catch(e){}}})}

/* backup */
function backupText(){return JSON.stringify({hisaab:1,saved:new Date().toISOString(),cols:S.cols,prof:S.prof})}
function isBackup(t){t=String(t||"").trim();return t.startsWith("{")&&t.includes('"hisaab"')}
function restoreSheet(text){
  let d;try{d=JSON.parse(text)}catch(e){toast("That backup is damaged. Copy the whole backup text and try again.");return}
  if(!d||!d.cols){toast("That isn't a Hisaab backup.");return}
  if(S.mode!=="local"){toast("Restore works in the phone app.");return}
  const n=(d.cols.txns||[]).length;
  openSheet(`<h3>Restore backup?</h3><p class="note" style="font-size:15px;color:var(--fg)">This replaces everything in Hisaab with the backup from ${esc(d.saved?new Date(d.saved).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"earlier")} (${n} entries).</p>
  <button class="primary" id="rs-yes">Replace with backup</button><button class="plain" id="rs-no">Cancel</button>`,()=>{
    $("rs-no").onclick=closeSheet;
    $("rs-yes").onclick=()=>{S.cols=Object.assign(blank(),d.cols);S.prof=Object.assign({cur:"Rs",catMap:{}},d.prof);saveLocal();closeSheet();render();toast("Backup restored")}})}

/* ---------- numbers ---------- */
function stats(){
  const mk=MK();const tx=S.cols.txns.filter(t=>(t.date||"").startsWith(mk));
  const sum=f=>tx.filter(f).reduce((a,t)=>a+(+t.amount||0),0);
  const inM=sum(t=>t.type==="in"),outM=sum(t=>t.type==="out");
  const unpaid=S.cols.bills.filter(b=>b.paid!==mk);
  const due=unpaid.reduce((a,b)=>a+(+b.amount||0),0);
  const byCat={};tx.filter(t=>t.type==="out").forEach(t=>{byCat[t.cat]=(byCat[t.cat]||0)+(+t.amount||0)});
  const loansLeft=S.cols.loans.reduce((a,l)=>a+Math.max(0,(+l.amount||0)-(+l.paidBack||0)),0);
  const saved=S.cols.savings.reduce((a,p)=>a+(+p.saved||0),0);
  return{tx,inM,outM,unpaid,due,left:inM-outM,byCat,loansLeft,saved,savedThisMonth:sum(t=>t.type==="out"&&t.cat==="Savings")}
}
function billStatus(b){const d=new Date().getDate();const day=+b.day||1;
  if(b.paid===MK()){const n=new Date();const nx=new Date(n.getFullYear(),n.getMonth()+1,1);
    return{cls:"",txt:"Paid · next due "+ord(day)+" "+nx.toLocaleDateString("en-GB",{month:"short"})}}
  if(day<d)return{cls:"over",txt:"Overdue · was due the "+ord(day)};
  if(day===d)return{cls:"over",txt:"Due today"};
  if(day-d<=5)return{cls:"soon",txt:"Due in "+(day-d)+" day"+(day-d>1?"s":"")};
  return{cls:"",txt:"Due the "+ord(day)+" of every month"}}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  const app=document.getElementById("app");
  if(S.loading){app.innerHTML='<p class="loading">Opening your hisaab…</p>';return}
  const v={home,bills,savings,loans,buy}[S.tab]||home;
  app.innerHTML=header()+v();
}
function header(){
  return `<header class="top"><div class="brand"><div class="coin">${ICON.note}</div><h1>Hisaab</h1></div>
  <button class="iconbtn" data-act="settings" aria-label="Settings">${ICON.gear}</button></header>`}
function txRow(t){const c=catColor(t.type,t.cat);
  const sub=(t.note?t.cat:(t.type==="in"?"Money in":"Spent"))+(t.src==="easypaisa"?" · Easypaisa":"");
  return `<button class="row" data-act="edit-tx" data-id="${t.id}"><div class="dot" style="background:${c}">${esc((t.cat||"?")[0])}</div>
  <div class="mid"><div class="t">${esc(t.note||t.cat)}</div><div class="s">${esc(sub)}</div></div>
  <div class="amt num ${t.type==="in"?"in":""}">${t.type==="in"?"+":"−"}${esc(S.prof.cur)} ${nf.format(+t.amount||0)}</div></button>`}
function home(){
  const s=stats();const after=s.left-s.due;const mon=new Date().toLocaleDateString("en-GB",{month:"long"});
  let h=`<section class="card" aria-label="This month">
    <div><div class="lbl">Left in ${mon}</div><div class="big num">${esc(money(s.left))}</div></div>

    ${s.loansLeft>0?`<div><button class="pill" data-tab="loans">Loans to clear: ${esc(money(s.loansLeft))}</button></div>`:""}

    <span>${after<0?`Short by ${esc(money(-after))}`:`Free to spend: ${esc(money(after))}`}</span></div></section>`;
  const d=new Date().getDate();

  const all=S.cols.txns.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0)).slice(0,60);
  if(!all.length)h+=`<div class="empty"><strong>Nothing added yet</strong><span>Tap <b>Add</b> each time you spend or get money.${NATIVE?" Or turn on Easypaisa SMS in Settings.":""}</span></div>`;
  else{const groups={};all.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
    h+=`<section class="sec"><div class="sechead"><h2>Recent</h2></div>`+Object.keys(groups).map(k=>{const sum=groups[k].filter(t=>t.type==="out").reduce((a,t)=>a+(+t.amount||0),0);

function billRow(b){const st=billStatus(b);const paid=b.paid===MK();

  <div class="tile"><div class="k">Free after bills</div><div class="v num" style="color:${s.left-s.due-need<0?"var(--bad)":"var(--good)"}">${esc(money(s.left-s.due))}</div></div></div>`;
  h+=open.length?`<div class="list">${open.map(buyRow).join("")}</div>`:`<div class="empty"><strong>Your list is empty</strong><span>Write things down before you buy them. It stops impulse spending.</span></div>`;

/* ---------- sheet ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),sin=document.getElementById("sheetin");
function openSheet(html,setup){sin.innerHTML='<div class="handle"></div>'+html;sin.onkeydown=null;sheet.hidden=false;scrim.hidden=false;
  requestAnimationFrame(()=>{sheet.classList.add("show");scrim.classList.add("show")});setup&&setup();
  const f=sin.querySelector("[autofocus]");if(f)setTimeout(()=>f.focus(),60)}
function closeSheet(){sheet.classList.remove("show");scrim.classList.remove("show");setTimeout(()=>{if(!sheet.classList.contains("show")){sheet.hidden=true;scrim.hidden=true;sin.innerHTML=""}},230)}
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
const $=id=>document.getElementById(id);
function onEnter(fn){sin.onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();fn()}}}
const amtField=(id,val,auto,label)=>`<div class="amtfield"><span>${esc(S.prof.cur)}</span><input id="${id}" inputmode="decimal" placeholder="0" autocomplete="off" value="${val??""}" ${auto?"autofocus":""} aria-label="${label||"Amount"}"></div>`;

function txSheet(t,draft){

  openSheet(`<h3>${t?"Edit entry":draft?"Add from Easypaisa":"Add money entry"}</h3>
  <div class="seg"><button data-type="out" aria-pressed="${st.type==="out"}">I spent</button><button class="inn" data-type="in" aria-pressed="${st.type==="in"}">I got money</button></div>
  ${amtField("f-amt",d0?d0.amount:"",!d0)}

  ${t?'<button class="ghost" id="f-del">Delete this entry</button>':""}`,()=>{
    sin.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;st.type=b.dataset.type;
      sin.querySelectorAll("[data-type]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("f-chips").innerHTML=chips();
      $("f-note").placeholder=st.type==="in"?"e.g. from Ali":"e.g. groceries"});
    $("f-chips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;st.cat=b.dataset.cat;
      sin.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    const save=async()=>{const a=parseAmt($("f-amt").value);

      const data={type:st.type,cat:st.cat,amount:a,note:$("f-note").value.trim(),date:$("f-date").value||today()};
      closeSheet();
      try{if(t){await upd("txns",t.id,data);
          if(t.src==="easypaisa"&&t.merchant&&data.type==="out"&&data.cat!==t.cat){const m=Object.assign({},S.prof.catMap||{});m[t.merchant]=data.cat;await setProf({catMap:m})}}
        else if(draft){const r=await saveImported(Object.assign({},draft,data));
          if(draft.merchant&&data.type==="out"&&data.cat!==draft.cat){const m=Object.assign({},S.prof.catMap||{});m[draft.merchant]=data.cat;await setProf({catMap:m})}
          toast(r==="matched"?"Matched with an entry you already added":r==="dup"?"That payment is already added":(data.type==="in"?"Added ":"Spent ")+money(a))}
        else{const r=await recordTxn(data);toast(r.matched?"Matched with your Easypaisa entry":(data.type==="in"?"Added ":"Spent ")+money(a))}}catch(e){toast(SAVE_ERR)}};

function moveSheet(p){

function repaySheet(l){

      try{const r=await recordTxn({type:"out",cat:"Loan repay",amount:a,note:"Paid back "+l.name,date:today()});
        const before={paidBack:+l.paidBack||0,payments:(l.payments||[]).slice()};

const find=(c,id)=>S.cols[c].find(x=>x.id===id);
document.addEventListener("click",async e=>{
  const tb=e.target.closest("[data-tab]");
  if(tb){S.tab=tb.dataset.tab;try{localStorage.setItem("hisaab.tab",S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-act]");if(!a)return;const id=a.dataset.id;
  switch(a.dataset.act){
    case"settings":settingsSheet();break;
    case"edit-tx":txSheet(find("txns",id));break;

    case"new-sav":savSheet();break;
    case"edit-sav":savSheet(find("savings",id));break;
    case"move-sav":moveSheet(find("savings",id));break;
    case"new-loan":loanSheet();break;
    case"edit-loan":loanSheet(find("loans",id));break;
    case"repay":repaySheet(find("loans",id));break;
    case"new-buy":buySheet();break;
    case"edit-buy":buySheet(find("buy",id));break;
    case"bought":buySheet(find("buy",id),true);break;
    case"clear-bought":{for(const i of S.cols.buy.filter(i=>i.done)){try{await del("buy",i.id)}catch(_){toast(SAVE_ERR);break}}break}
  }
});
document.getElementById("fab").onclick=()=>txSheet();

let tt;const toastEl=document.getElementById("toast"),undoBtn=document.getElementById("toastundo");
function toast(msg,undo){document.getElementById("toastmsg").textContent=msg;undoBtn.hidden=!undo;
  undoBtn.onclick=async()=>{toastEl.classList.remove("show");try{await undo()}catch(e){toast(SAVE_ERR)}};
  toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),undo?5000:2600)}

window.hisaabBack=function(){if(!sheet.hidden){closeSheet();return true}if(S.tab!=="home"){S.tab="home";try{localStorage.setItem("hisaab.tab","home")}catch(_){}render();window.scrollTo(0,0);return true}return false};
render();connect();
