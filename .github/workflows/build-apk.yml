name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Creates the signing key once and saves it in the repo, so every
      # new APK installs over the old one without losing your data.
      - name: Create signing key (first run only)
        run: |
          if [ ! -f app/hisaab.keystore ]; then
            keytool -genkeypair -v -keystore app/hisaab.keystore -alias hisaab \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hisaab-key -keypass hisaab-key \
              -dname "CN=Hisaab, O=Hisaab, C=PK"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/hisaab.keystore
            git commit -m "Add app signing key [skip ci]"
            git push
          fi

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Hisaab.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hisaab 1.0.${{ github.run_number }}
          body: Download Hisaab.apk below and open it on your Android phone to install.
          files: Hisaab.apk
          make_latest: true
